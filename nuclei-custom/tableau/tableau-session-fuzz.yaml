id: tableau-session-fuzz

info:
  name: Tableau VizQL EPS Session Discovery
  author: jtc-security
  severity: info
  description: Fuzzes VizQL session candidates to find an active EPS endpoint returning true.
  tags: tableau,vizql,session,fuzz

http:
  - method: GET
    path:
      - "{{BaseURL}}/vizql/sessions/ABC-1:0/eps/main/status"
      - "{{BaseURL}}/vizql/sessions/ABC-1:1/eps/main/status"
      - "{{BaseURL}}/vizql/sessions/ABC-1:2/eps/main/status"
      - "{{BaseURL}}/vizql/sessions/ABC-1:3/eps/main/status"
      - "{{BaseURL}}/vizql/sessions/ABC-1:4/eps/main/status"
      - "{{BaseURL}}/vizql/sessions/ABC-1:5/eps/main/status"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "true"

      - type: status
        status:
          - 200
